services:
  - type: web
    name: gjevents
    env: python
    plan: starter
    buildCommand: pip install --prefer-binary -r requirements.txt && npm ci && npm run build && python manage.py collectstatic --noinput
    startCommand: python manage.py migrate && python manage.py ensure_admin && gunicorn gj_event_dashboard.wsgi:application
    envVars:
      - key: DJANGO_DEBUG
        value: "False"
      - key: DJANGO_ALLOWED_HOSTS
        value: gjevents.in,www.gjevents.in,gjevents-bfjz.onrender.com
      - key: DJANGO_CSRF_TRUSTED_ORIGINS
        value: https://gjevents.in,https://www.gjevents.in,https://gjevents.github.io,https://gjevents-bfjz.onrender.com
      - key: DJANGO_CORS_ALLOWED_ORIGINS
        value: https://gjevents.in,https://www.gjevents.in,https://gjevents.github.io
      - key: DATABASE_URL
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: DJANGO_SUPERUSER_USERNAME
        sync: false
      - key: DJANGO_SUPERUSER_EMAIL
        sync: false
      - key: DJANGO_SUPERUSER_PASSWORD
        sync: false
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: PYTHON_VERSION
        value: 3.12.8
